plugins {
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '6.1.0'
    id 'org.jetbrains.kotlin.jvm' version '1.6.0'
}

allprojects {
    group 'gg.scala.credit'
    version '1.0.0'

    repositories {
        mavenCentral()
        mavenLocal()

        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url "https://oss.sonatype.org/content/repositories/central" }
        maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
        maven { url "https://hub.spigotmc.org/nexus/content/groups/public/" }
        maven { url "https://repo.aikar.co/content/groups/aikar/" }
        maven { url "https://repo.lucko.me" }
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "com.github.johnrengelman.shadow"
    apply plugin: "org.jetbrains.kotlin.jvm"

    dependencies {
        compileOnly "org.jetbrains.kotlin:kotlin-stdlib"
        compileOnly "org.spigotmc:spigot-api:1.18-R0.1-SNAPSHOT"
        compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.0-RC2"

        implementation "com.github.cryptomorin:XSeries:8.5.0.1"
        implementation "me.lucko:helper:5.6.8"
        implementation "co.aikar:acf-bukkit:0.5.0-SNAPSHOT"
    }

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "1.8"
    }

    shadowJar {
        relocate 'co.aikar.commands', 'gg.scala.credit.acf'
        relocate 'co.aikar.locales', 'gg.scala.credit.locales'

        archiveClassifier.set("")

        exclude "**/*.kotlin_metadata"
        exclude "**/*.kotlin_builtins"
        exclude "META-INF/"

        archiveFileName = "player-credit_${project.name}.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }
    }

    tasks.build.dependsOn(shadowJar, publishing)
}
